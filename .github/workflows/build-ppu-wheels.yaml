name: PPU CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      existing_build_run_id:
        description: Reuse an existing ppu-wheels artifact for pin UT only (blank builds new wheels)
        required: false
        default: ""
        type: string
      build_image:
        description: 设备验证构建镜像完整 digest；空值使用批准基线
        required: false
        default: ""
        type: string
      device_image:
        description: 设备运行镜像完整 digest；空值使用批准基线
        required: false
        default: ""
        type: string
      device_test_scope:
        description: 首阶段手动入口始终 full，auto 留待资格验证后启用
        default: full
        type: choice
        options: [auto, full]
      qualification_mode:
        description: 收集双板型候选资格证据，不自动批准
        default: false
        type: boolean
      sdk_url:
        description: SAIL SDK installer URL
        required: true
        default: https://art-pub.eng.t-head.cn/artifactory/apackage/daily/ppu.2v2_release/ppu.2v2_release-202609251051/PPU_SDK/ppu_1.0.0_Ubuntu2404_v13_release.run
        type: string
      torch_url:
        description: SAIL PyTorch archive URL
        required: true
        default: https://art-pub.eng.t-head.cn/artifactory/apackage/daily/ppu.2v2_release/latest/PPU_SDK_PYPI/pytorch/ppu_sdk_hggcrt3-pytorch2.13.0-ubuntu2404-py312.tar.gz
        type: string
      vllm_ref:
        description: vLLM ref (blank uses .github/vllm-main-verified.commit)
        required: false
        default: ""
        type: string
      pytorch_sail_arch:
        description: Semicolon-separated HG architectures
        required: true
        default: ppu_15;ppu_10
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ppu-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.existing_build_run_id == '' && github.event_name != 'workflow_dispatch'
    name: PPU wheel build
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 180
    container:
      image: ${{ inputs.build_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
    env:
      SDK_URL: ${{ inputs.sdk_url }}
      TORCH_URL: ${{ inputs.torch_url }}
      VLLM_REF: ${{ inputs.vllm_ref }}
      PYTORCH_SAIL_ARCH: ${{ inputs.pytorch_sail_arch || 'ppu_15;ppu_10' }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The self-hosted CPU runner image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done
          echo "=== insteadOf after (system) ==="
          git config --system --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none
          echo "=== insteadOf after (global) ==="
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Build wheels
        run: bash scripts/ci/build_ppu_wheels.sh

      - name: Upload wheels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          if-no-files-found: warn
          retention-days: 14

  # This pipeline remains manual until both board types are qualified.
  detect-device-changes:
    if: github.event_name == 'workflow_dispatch' && inputs.existing_build_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_image: ${{ steps.detect.outputs.build_image }}
      runtime_image: ${{ steps.detect.outputs.runtime_image }}
      expected_vllm_commit: ${{ steps.detect.outputs.expected_vllm_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 固定手动验证身份与镜像
        id: detect
        env:
          BUILD_IMAGE_OVERRIDE: ${{ inputs.build_image }}
          DEVICE_IMAGE_OVERRIDE: ${{ inputs.device_image }}
          VLLM_REF_OVERRIDE: ${{ inputs.vllm_ref }}
          QUALIFICATION_MODE: ${{ inputs.qualification_mode }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.ci.ppu_device_select import (
              validate_config, validate_environment, resolve_build_image,
              digest_image, sha, require, github_outputs, collect_changes, write_json,
          )
          root = Path.cwd()
          environment = json.loads(Path('scripts/ci/ppu_device_environment.json').read_bytes())
          validate_config(json.loads(Path('scripts/ci/ppu_device_tests.json').read_bytes()), root)
          qualified = validate_environment(environment)
          require(qualified or os.environ['QUALIFICATION_MODE'] == 'true', '初次基线必须开启 qualification_mode')
          image = resolve_build_image(environment, os.environ['BUILD_IMAGE_OVERRIDE'])
          runtime = digest_image(os.environ['DEVICE_IMAGE_OVERRIDE'] or environment['runtime_image'])
          expected = sha(os.environ['VLLM_REF_OVERRIDE'] or Path('.github/vllm-main-verified.commit').read_text().strip())
          github_outputs(dict(build_image=image, runtime_image=runtime, expected_vllm_commit=expected))
          write_json('changes.json', collect_changes(root, None, None, os.environ['GITHUB_SHA']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-device-changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: changes.json
          if-no-files-found: error
          retention-days: 14

  device-build:
    needs: detect-device-changes
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 180
    container:
      image: ${{ needs.detect-device-changes.outputs.build_image }}
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      VLLM_SAIL_BUILD_IMAGE: ${{ needs.detect-device-changes.outputs.build_image }}
      SDK_URL: ${{ inputs.sdk_url }}
      TORCH_URL: ${{ inputs.torch_url }}
      VLLM_REF: ${{ needs.detect-device-changes.outputs.expected_vllm_commit }}
      PYTORCH_SAIL_ARCH: ${{ inputs.pytorch_sail_arch }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: 准备作业内独立 Git 配置
        id: git-config
        shell: bash
        run: |
          # Checkout writes safe.directory; retain this config through post-job cleanup.
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 构建本次正式 wheel
        run: bash scripts/ci/build_ppu_wheels.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          if-no-files-found: error
          retention-days: 14

  select-device-tests:
    needs: [detect-device-changes, device-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-device-changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: device-selection
      - uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: device-wheels
      - uses: actions/download-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          path: device-build-diagnostics
      - name: 校验产物并生成 full 清单
        id: select
        env:
          BUILD_IMAGE: ${{ needs.detect-device-changes.outputs.build_image }}
          RUNTIME_IMAGE: ${{ needs.detect-device-changes.outputs.runtime_image }}
          EXPECTED_VLLM_COMMIT: ${{ needs.detect-device-changes.outputs.expected_vllm_commit }}
        run: |
          cp scripts/ci/ppu_device_tests.json scripts/ci/ppu_device_environment.json device-selection/
          python scripts/ci/ppu_device_select.py select --repo . \
            --config device-selection/ppu_device_tests.json --environment device-selection/ppu_device_environment.json \
            --changes device-selection/changes.json --build-manifest device-build-diagnostics/build-manifest.txt \
            --wheel-manifest device-wheels/wheel-manifest.json --build-run-id "$GITHUB_RUN_ID" \
            --build-image "$BUILD_IMAGE" --runtime-image "$RUNTIME_IMAGE" \
            --expected-vllm-commit "$EXPECTED_VLLM_COMMIT" --scope full --output device-selection/selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-device-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: device-selection/
          if-no-files-found: error
          retention-days: 14

  device-tests:
    needs: [detect-device-changes, select-device-tests]
    if: needs.select-device-tests.outputs.has_tests == 'true'
    uses: ./.github/workflows/ppu-device-tests.yaml
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}
      matrix: ${{ needs.select-device-tests.outputs.matrix }}
      selection_artifact: ppu-device-selection-${{ github.run_id }}-${{ github.run_attempt }}
      build_image: ${{ needs.detect-device-changes.outputs.build_image }}
      expected_vllm_commit: ${{ needs.detect-device-changes.outputs.expected_vllm_commit }}
      image: ${{ needs.detect-device-changes.outputs.runtime_image }}
      qualification_mode: ${{ inputs.qualification_mode }}

  pin-unit-tests:
    name: PPU pin UT
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.existing_build_run_id != '')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ppu-pin-ut.yaml
    with:
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}

  smoke:
    name: PPU E2E smoke
    needs: build
    # PR smoke and pin UT consume this run's wheels in separate fresh pods.
    # Manual artifact reuse remains available for pin-UT debugging only.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/e2e-ppu.yaml
    with:
      build_run_id: ${{ github.run_id }}

  gate:
    name: PPU CI gate
    needs: [build, pin-unit-tests, smoke]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every PPU stage to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          for job, result in results.items():
              print(f"{job}: {result['result']}")
          failed = [job for job, result in results.items() if result["result"] != "success"]
          if failed:
              raise SystemExit(f"Required PPU stages did not succeed: {', '.join(failed)}")
          PYTHON
