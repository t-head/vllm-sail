name: PPU CI authorization notification

on:
  pull_request_target:
    types: [labeled]

permissions: {}
cache-mode: none

jobs:
  notify:
    if: >-
      github.repository == 't-head/vllm-sail' &&
      (github.event.label.name == 'ready' || github.event.label.name == 'ready-run-all-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ppu-notification-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Resolve immutable default-branch code
        id: default-revision
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const {data: repo} = await github.rest.repos.get(context.repo);
            const {data: commit} = await github.rest.repos.getCommit({
              ...context.repo, ref: repo.default_branch,
            });
            if (!/^[0-9a-f]{40}$/.test(commit.sha)) throw new Error('Invalid default revision');
            return commit.sha;
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.default-revision.outputs.result }}
          persist-credentials: false
      - name: Notify without dispatching tests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python -m scripts.ci.ppu_ci_command notify
