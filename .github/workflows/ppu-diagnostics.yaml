name: PPU diagnostics (not qualification)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Original build run supplying wheels, build diagnostics, and first-attempt ops selection
        required: true
        type: string
      probe_sail_commit:
        description: Full SAIL commit of the original wheels
        required: true
        type: string
      probe_suite:
        description: Diagnostic suite; visibility observes devices, gdn also runs both GDN test files
        type: choice
        default: visibility
        options:
          - visibility
          - gdn
      image:
        description: Runtime container image matching the original diagnostic artifacts
        required: true
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ppu-diagnostics-${{ github.ref }}-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  device-probe:
    name: Device probe ${{ matrix.board }} (not qualification)
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 35
    container:
      image: ${{ inputs.image }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - board: ppu10
            selector: OAM-810E
          - board: ppu15
            selector: ZW-M890P
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      WHEELS_DIR: /tmp/probe-wheels
      BUILD_MANIFEST_FILE: /tmp/probe-build/build-manifest.txt
      SELECTION_FILE: /tmp/probe-selection/selection.json
      DEVICE_BOARD: ${{ matrix.board }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROBE_CODE_SHA: ${{ github.sha }}
      PROBE_SUITE: ${{ inputs.probe_suite }}
      EXPECTED_SAIL_COMMIT: ${{ inputs.probe_sail_commit }}
      EXPECTED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_BUILD_IMAGE: ${{ inputs.image }}
      RUNTIME_IMAGE: ${{ inputs.image }}
      SAIL_PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      CPU_RESULTS: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/device-probe/${{ matrix.board }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare isolated job-local Git configuration
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: /tmp/probe-wheels
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ inputs.build_run_id }}
          path: /tmp/probe-build
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          # Diagnostics currently accept only the first attempt of the original build.
          name: ppu-ops-selection-${{ inputs.build_run_id }}-1
          path: /tmp/probe-selection
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Validate original build identity and start bounded read-only Pod collection
        run: |
          EXPECTED_VLLM_COMMIT="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          export EXPECTED_VLLM_COMMIT
          printf 'EXPECTED_VLLM_COMMIT=%s\n' "$EXPECTED_VLLM_COMMIT" >> "$GITHUB_ENV"
          python scripts/ci/ppu_ops_probe.py prepare
          nohup python scripts/ci/ppu_ops_probe.py watch > "$RUNNER_TEMP/probe-watch.log" 2>&1 < /dev/null &
          printf 'PROBE_WATCH_PID=%s\n' "$!" >> "$GITHUB_ENV"
      - name: Run single-device Pod diagnostics (visibility or GDN, not qualification)
        uses: t-head/ppu-scheduler-action@a4e03cbbdb2624f4871fff30d7081b34cbc4b7d4
        with:
          image: ${{ inputs.image }}
          nnodes: 0
          nproc_per_node: 1
          namespace: ppu-sched
          node_selector: board-type=${{ matrix.selector }}
          timeout_minutes: 25
          cleanup_policy: always
          job_suffix: probe-${{ matrix.board }}
          source_dir: /workspace/source
          artifact_paths: |
            /tmp/probe-wheels
            /tmp/probe-build
            /tmp/probe-selection
          extra_env: WHEELS_DIR=/workspace/source/probe-wheels,BUILD_MANIFEST_FILE=/workspace/source/probe-build/build-manifest.txt,SELECTION_FILE=/workspace/source/probe-selection/selection.json,EXPECTED_VLLM_COMMIT=${{ env.EXPECTED_VLLM_COMMIT }},EXPECTED_SAIL_COMMIT=${{ inputs.probe_sail_commit }},EXPECTED_BUILD_RUN_ID=${{ inputs.build_run_id }},EXPECTED_BUILD_IMAGE=${{ inputs.image }},RUNTIME_IMAGE=${{ inputs.image }},PROBE_CODE_SHA=${{ github.sha }},PROBE_SUITE=${{ inputs.probe_suite }},CI_RUN_ID=${{ github.run_id }},CI_RUN_ATTEMPT=${{ github.run_attempt }},DEVICE_BOARD=${{ matrix.board }},SAIL_PIP_INDEX_URL=${{ env.SAIL_PIP_INDEX_URL }}
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          # Use the qualification worker's device binding and report the effective environment.
          command: >-
            cd /workspace/source &&
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}" &&
            python scripts/ci/ppu_ops_probe.py run
      - name: Stop read-only collection and wait for evidence to be saved
        if: always()
        run: |
          if [[ -d "$CPU_RESULTS" ]]; then
            touch "$CPU_RESULTS/watch.stop"
          fi
          if [[ -n "${PROBE_WATCH_PID:-}" ]]; then
            for _ in {1..15}; do
              kill -0 "$PROBE_WATCH_PID" 2>/dev/null || break
              sleep 1
            done
          fi
      - name: Revalidate GDN diagnostic identity, nodes, and JUnit
        if: always() && inputs.probe_suite == 'gdn'
        run: python scripts/ci/ppu_ops_probe.py finish
      - name: Upload diagnostic evidence (not qualification results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-ops-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.board }}
          path: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/device-probe/${{ matrix.board }}/
          if-no-files-found: error
          retention-days: 14
