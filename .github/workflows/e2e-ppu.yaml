name: E2E PPU

# Dual-mode PPU end-to-end workflow (plan PART 8):
#
# 1. PR smoke (legacy server) — invoked via workflow_call from build-ppu-wheels.
#    Keeps the existing one-chat-completion server smoke on OAM-810E until the
#    Week 5-8 decision replaces it with the offline path.
#
# 2. Nightly offline E2E (dual-chip parallel) — triggered by schedule or manual
#    dispatch. Runs operator numeric tests (kernels/) and offline model precision
#    tests (models/) on both ZW-810E (16 cards, cap80) and ZW-890P (8 cards,
#    cap89) in parallel via the ppu-scheduler-action. NO server is started;
#    pytest drives vLLM's offline LLM API directly.
#
# Runner label assumption (MUST confirm with infra):
#   810E: board-type=OAM-810E  (existing label, verified in PR smoke)
#   890P: board-type=OAM-890P  (PLACEHOLDER — no existing 890P runs in this
#         repo; the label must be registered on the k8s PPU node pool before
#         nightly can schedule successfully. If the actual label differs,
#         update the matrix include entry for 890p.)
#
# Nightly wheel resolution:
#   schedule/dispatch do not carry a build_run_id input. The prepare job
#   queries the GitHub API for the latest successful PPU CI (build-ppu-wheels)
#   run and reuses its wheels, so nightly does NOT rebuild.
#
# Golden promotion (operational workflow):
#   First run on a chip writes a pending-review golden (_offline_runner.py
#   "created" path) into tests/e2e/models/_golden/. The workflow uploads that
#   directory as a CI artifact. A human reviews, then copies the JSON into the
#   repo and commits (never auto-committed). Subsequent runs compare against
#   the committed golden; mismatch fails the lane.

on:
  # --- Called by build-ppu-wheels.yaml for PR-time server smoke (unchanged
  # contract: build_run_id is the only required input from the caller).
  workflow_call:
    inputs:
      build_run_id:
        description: Run supplying the ppu-wheels artifact
        required: true
        type: string
      models:
        description: Comma-separated model catalog keys
        type: string
        default: qwen3.8-27b
      image:
        description: SAIL runtime image
        type: string
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952

  # --- Manual dispatch: offline nightly lanes with an optional build_run_id.
  # Blank build_run_id triggers the same "resolve latest" logic as schedule.
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "PPU CI build run to reuse (blank = resolve latest successful)"
        required: false
        default: ""
        type: string
      models:
        description: Comma-separated catalog keys (blank = all)
        required: false
        default: ""
        type: string
      image:
        description: Runtime container image the PPU pod runs
        required: true
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952
        type: string
      update_golden:
        description: "Pass --update-golden to rewrite baselines (use with caution)"
        required: false
        default: false
        type: boolean

  # --- Nightly schedule (18:00 UTC = 02:00 CST).
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  # Downloading an artifact produced by another run needs the actions:read scope.
  actions: read

concurrency:
  group: e2e-ppu-${{ github.ref }}-${{ inputs.build_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  # ==============================================================
  # prepare: resolve model matrix, offline outputs, and build_run_id
  # ==============================================================
  prepare:
    name: Resolve matrix & build
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 10
    container:
      image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      model_root: ${{ steps.select.outputs.model_root }}
      offline_test_path: ${{ steps.select.outputs.offline_test_path }}
      offline_marker: ${{ steps.select.outputs.offline_marker }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Select models
        id: select
        shell: bash
        env:
          MODELS: ${{ inputs.models }}
        run: python3 scripts/ci/ppu_e2e_select.py "${MODELS}" >> "$GITHUB_OUTPUT"

      - name: Resolve build run id
        id: resolve
        shell: bash
        env:
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${INPUT_BUILD_RUN_ID}" ]]; then
            echo "Using supplied build_run_id=${INPUT_BUILD_RUN_ID}"
            echo "build_run_id=${INPUT_BUILD_RUN_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nightly schedule or blank dispatch: reuse the newest successful
          # PPU CI build so offline lanes test fresh wheels without rebuilding.
          base="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-ppu-wheels.yaml/runs"
          hdr_auth="Authorization: Bearer ${GH_TOKEN}"
          hdr_accept="Accept: application/vnd.github+json"
          parse_id() {
            python3 -c 'import sys,json;r=json.load(sys.stdin).get("workflow_runs",[]);print(r[0]["id"] if r else "")'
          }
          run_id="$(curl -fsSL -H "${hdr_auth}" -H "${hdr_accept}" \
            "${base}?status=success&per_page=1&branch=${GITHUB_REF_NAME}" | parse_id || true)"
          if [[ -z "${run_id}" ]]; then
            echo "no successful PPU CI build on branch ${GITHUB_REF_NAME}; trying any branch"
            run_id="$(curl -fsSL -H "${hdr_auth}" -H "${hdr_accept}" \
              "${base}?status=success&per_page=1" | parse_id || true)"
          fi
          if [[ -z "${run_id}" ]]; then
            echo "::error::nightly offline E2E could not resolve a successful PPU CI build"
            exit 1
          fi
          echo "Resolved latest successful PPU CI build_run_id=${run_id}"
          echo "build_run_id=${run_id}" >> "$GITHUB_OUTPUT"

  # ==============================================================
  # smoke: legacy server-based E2E (PR only, via workflow_call)
  # Kept until Week 5-8 decision replaces it with offline-only.
  # ==============================================================
  smoke:
    name: E2E smoke ${{ matrix.model.key }}
    needs: prepare
    if: github.event_name == 'pull_request'
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 120
    container:
      image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ needs.prepare.outputs.build_run_id }}
          path: wheels
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Require the current PR artifact and verified upstream pin
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${pin}" =~ ^[0-9a-f]{40}$ ]]
          python scripts/ci/ppu_wheel_manifest.py verify wheels \
            --vllm-commit "${pin}" --sail-commit "${GITHUB_SHA}"

      - name: Run PPU E2E smoke
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
          nnodes: 0
          nproc_per_node: ${{ matrix.model.tp }}
          namespace: ppu-sched
          node_selector: board-type=${{ matrix.model.board }}
          timeout_minutes: 90
          cleanup_policy: always
          source_dir: /workspace/source
          artifact_paths: wheels/**
          extra_env: MODEL_PATH=${{ matrix.model.checkpoint }},SERVED_NAME=${{ matrix.model.served_name }},TP_SIZE=${{ matrix.model.tp }},EXTRA_SERVE_FLAGS=${{ matrix.model.extra_serve_flags }},VLLM_USE_RUST_FRONTEND=0,VLLM_USE_RUST_BENCH=0,WHEELS_DIR=/workspace/source/wheels
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 32Gi
          command: cd /workspace/source && bash scripts/ci/ppu_e2e_smoke.sh

  # ==============================================================
  # offline: dual-chip parallel offline E2E (nightly / dispatch only)
  #
  # Matrix: 2 chips × 2 suites = 4 parallel lanes, fail-fast=false.
  # Each lane dispatches a PPU pod via the scheduler action.
  # ==============================================================
  offline:
    name: E2E offline ${{ matrix.chip }} ${{ matrix.suite }}
    needs: prepare
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: ${{ matrix.timeout + 30 }}
    container:
      image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
    strategy:
      # All 4 lanes run independently; one failure must not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # --- 810E kernels (cap80 + generic ppu; cap89 auto-skip by conftest)
          - chip: 810e
            board: OAM-810E
            nproc: 16
            suite: kernels
            test_path: tests/e2e/kernels
            marker: ""
            timeout: 60
          # --- 890P kernels (cap89 + generic ppu; cap80 auto-skip by conftest)
          - chip: 890p
            board: OAM-890P
            nproc: 8
            suite: kernels
            test_path: tests/e2e/kernels
            marker: ""
            timeout: 60
          # --- 810E models (offline LLM, TP=16 derived from chip profile)
          # 240min: tests/e2e/models now runs 4 large MoE models serially
          # (qwen3_next/deepseek_v4/minimax_m3/kimi_k3).
          - chip: 810e
            board: OAM-810E
            nproc: 16
            suite: models
            test_path: ${{ needs.prepare.outputs.offline_test_path }}
            marker: ${{ needs.prepare.outputs.offline_marker }}
            timeout: 240
          # --- 890P models (offline LLM, TP=8 derived from chip profile)
          - chip: 890p
            board: OAM-890P
            nproc: 8
            suite: models
            test_path: ${{ needs.prepare.outputs.offline_test_path }}
            marker: ${{ needs.prepare.outputs.offline_marker }}
            timeout: 240
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ needs.prepare.outputs.build_run_id }}
          path: wheels
          run-id: ${{ needs.prepare.outputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify wheel manifest
        shell: bash
        run: |
          python scripts/ci/ppu_wheel_manifest.py verify wheels

      - name: Run offline E2E (${{ matrix.chip }} ${{ matrix.suite }})
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ inputs.image || 'reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952' }}
          nnodes: 0
          nproc_per_node: ${{ matrix.nproc }}
          namespace: ppu-sched
          # 890P board label is a PLACEHOLDER — see header comment.
          node_selector: board-type=${{ matrix.board }}
          timeout_minutes: ${{ matrix.timeout }}
          cleanup_policy: always
          job_suffix: offline-${{ matrix.chip }}-${{ matrix.suite }}
          source_dir: /workspace/source
          artifact_paths: wheels/**
          extra_env: SUITE=${{ matrix.suite }},TEST_PATH=${{ matrix.test_path }},PYTEST_MARKER=${{ matrix.marker }},MODEL_PATH=${{ needs.prepare.outputs.model_root }},RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/e2e-offline-${{ matrix.chip }}-${{ matrix.suite }},WHEELS_DIR=/workspace/source/wheels,VLLM_USE_RUST_FRONTEND=0,VLLM_USE_RUST_BENCH=0,UPDATE_GOLDEN=${{ inputs.update_golden && '1' || '0' }}
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 32Gi
          command: cd /workspace/source && bash scripts/ci/ppu_e2e_offline.sh

      - name: Upload offline E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-e2e-offline-${{ matrix.chip }}-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/e2e-offline-${{ matrix.chip }}-${{ matrix.suite }}/*.xml
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/e2e-offline-${{ matrix.chip }}-${{ matrix.suite }}/*.log
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/e2e-offline-${{ matrix.chip }}-${{ matrix.suite }}/golden/*.json
          if-no-files-found: warn
          retention-days: 14
