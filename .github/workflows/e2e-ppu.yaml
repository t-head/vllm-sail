name: E2E PPU smoke

# End-to-end smoke test on real PPU cards. It reuses the wheels produced by a
# PPU CI build, serves a model from the auto-mounted NAS checkpoint,
# and verifies one chat completion. PR CI calls this after its wheel build;
# manual dispatch can still select an existing build for investigation.

on:
  workflow_call:
    inputs:
      build_run_id:
        description: Run supplying the ppu-wheels artifact
        required: true
        type: string
      models:
        description: Comma-separated model catalog keys
        type: string
        default: qwen3.8-27b
      image:
        description: SAIL runtime image
        type: string
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952
  workflow_dispatch:
    inputs:
      device_probe_only:
        description: Run non-qualification diagnostics on both board types without model or qualification tests
        type: boolean
        default: false
      probe_suite:
        description: Only applies to device_probe_only; visibility observes devices, gdn runs both GDN test files
        type: choice
        default: visibility
        options:
          - visibility
          - gdn
      probe_sail_commit:
        description: Full SAIL commit of the original wheels (required only for diagnostics)
        type: string
        default: ''
      build_run_id:
        description: Run ID of a PPU CI build whose ppu-wheels-<run_id> artifact holds the wheels under test
        required: true
        type: string
      models:
        description: Comma-separated catalog keys to run (blank = every model in scripts/ci/ppu_e2e_models.json)
        required: false
        default: qwen3.8-27b
        type: string
      image:
        description: Runtime container image the PPU pod runs
        required: true
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952
        type: string

permissions:
  contents: read
  # Downloading an artifact produced by another run needs the actions:read scope.
  actions: read

concurrency:
  group: e2e-ppu-${{ github.ref }}-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !inputs.device_probe_only }}
    name: Resolve model matrix
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 10
    container:
      # The runtime image ships py312; reuse it so the selector always has python3.
      image: ${{ inputs.image }}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The self-hosted CPU runner image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Select models
        id: select
        shell: bash
        # Pass the caller-controlled input through the environment (never inline
        # it into the command) so a crafted value cannot inject shell.
        env:
          MODELS: ${{ inputs.models }}
        run: python3 scripts/ci/ppu_e2e_select.py "${MODELS}" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E ${{ matrix.model.key }}
    needs: prepare
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 120
    container:
      # k8s-runner-group-cpu-thead forbids container-less jobs. This container
      # only hosts checkout/download-artifact and the scheduler action, which
      # then dispatches the real workload to a separate PPU pod.
      image: ${{ inputs.image }}
    strategy:
      # Each model occupies PPU cards independently; keep going if one fails.
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.prepare.outputs.matrix).include }}
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # See the prepare job: strip the github.com insteadOf rewrites so
          # actions/checkout and download-artifact reach github.com directly.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: wheels
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Require the current PR artifact and verified upstream pin
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pin="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${pin}" =~ ^[0-9a-f]{40}$ ]]
          python scripts/ci/ppu_wheel_manifest.py verify wheels \
            --vllm-commit "${pin}" --sail-commit "${GITHUB_SHA}"

      - name: Run PPU E2E smoke
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ inputs.image }}
          # Single node; nproc_per_node matches the tensor-parallel card count.
          nnodes: 0
          nproc_per_node: ${{ matrix.model.tp }}
          namespace: ppu-sched
          # The built wheels (arch ppu_15;ppu_10) are only verified on 810E.
          node_selector: board-type=${{ matrix.model.board }}
          timeout_minutes: 90
          cleanup_policy: always
          source_dir: /workspace/source
          # Ship the checked-out repo plus the downloaded wheels into the pod.
          artifact_paths: wheels/**
          # The manifest travels with the wheels; compatibility uses their real
          # version. This smoke runs the Python frontend.
          extra_env: MODEL_PATH=${{ matrix.model.checkpoint }},SERVED_NAME=${{ matrix.model.served_name }},TP_SIZE=${{ matrix.model.tp }},EXTRA_SERVE_FLAGS=${{ matrix.model.extra_serve_flags }},VLLM_USE_RUST_FRONTEND=0,VLLM_USE_RUST_BENCH=0,WHEELS_DIR=/workspace/source/wheels
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 32Gi
          command: cd /workspace/source && bash scripts/ci/ppu_e2e_smoke.sh

  device-probe:
    name: Device probe ${{ matrix.board }} (not qualification)
    if: github.event_name == 'workflow_dispatch' && inputs.device_probe_only
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 35
    container:
      image: ${{ inputs.image }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - board: ppu10
            selector: OAM-810E
          - board: ppu15
            selector: ZW-M890P
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      WHEELS_DIR: /tmp/probe-wheels
      BUILD_MANIFEST_FILE: /tmp/probe-build/build-manifest.txt
      SELECTION_FILE: /tmp/probe-selection/selection.json
      DEVICE_BOARD: ${{ matrix.board }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROBE_CODE_SHA: ${{ github.sha }}
      PROBE_SUITE: ${{ inputs.probe_suite }}
      EXPECTED_SAIL_COMMIT: ${{ inputs.probe_sail_commit }}
      EXPECTED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_BUILD_IMAGE: ${{ inputs.image }}
      RUNTIME_IMAGE: ${{ inputs.image }}
      SAIL_PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
      CPU_RESULTS: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/device-probe/${{ matrix.board }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare isolated job-local Git configuration
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: /tmp/probe-wheels
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ inputs.build_run_id }}
          path: /tmp/probe-build
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          # Diagnostics currently accept only the first attempt of the original build.
          name: ppu-device-selection-${{ inputs.build_run_id }}-1
          path: /tmp/probe-selection
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Validate original build identity and start bounded read-only Pod collection
        run: |
          EXPECTED_VLLM_COMMIT="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          export EXPECTED_VLLM_COMMIT
          printf 'EXPECTED_VLLM_COMMIT=%s\n' "$EXPECTED_VLLM_COMMIT" >> "$GITHUB_ENV"
          python scripts/ci/ppu_device_probe.py prepare
          nohup python scripts/ci/ppu_device_probe.py watch > "$RUNNER_TEMP/probe-watch.log" 2>&1 < /dev/null &
          printf 'PROBE_WATCH_PID=%s\n' "$!" >> "$GITHUB_ENV"
      - name: Run single-device Pod diagnostics (visibility or GDN, not qualification)
        uses: t-head/ppu-scheduler-action@a4e03cbbdb2624f4871fff30d7081b34cbc4b7d4
        with:
          image: ${{ inputs.image }}
          nnodes: 0
          nproc_per_node: 1
          namespace: ppu-sched
          node_selector: board-type=${{ matrix.selector }}
          timeout_minutes: 25
          cleanup_policy: always
          job_suffix: probe-${{ matrix.board }}
          source_dir: /workspace/source
          artifact_paths: |
            /tmp/probe-wheels
            /tmp/probe-build
            /tmp/probe-selection
          extra_env: WHEELS_DIR=/workspace/source/probe-wheels,BUILD_MANIFEST_FILE=/workspace/source/probe-build/build-manifest.txt,SELECTION_FILE=/workspace/source/probe-selection/selection.json,EXPECTED_VLLM_COMMIT=${{ env.EXPECTED_VLLM_COMMIT }},EXPECTED_SAIL_COMMIT=${{ inputs.probe_sail_commit }},EXPECTED_BUILD_RUN_ID=${{ inputs.build_run_id }},EXPECTED_BUILD_IMAGE=${{ inputs.image }},RUNTIME_IMAGE=${{ inputs.image }},PROBE_CODE_SHA=${{ github.sha }},PROBE_SUITE=${{ inputs.probe_suite }},CI_RUN_ID=${{ github.run_id }},CI_RUN_ATTEMPT=${{ github.run_attempt }},DEVICE_BOARD=${{ matrix.board }},SAIL_PIP_INDEX_URL=${{ env.SAIL_PIP_INDEX_URL }}
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          # Use the qualification worker's device binding and report the effective environment.
          command: >-
            cd /workspace/source &&
            export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES:?Assigned devices are unavailable}" &&
            python scripts/ci/ppu_device_probe.py run
      - name: Stop read-only collection and wait for evidence to be saved
        if: always()
        run: |
          if [[ -d "$CPU_RESULTS" ]]; then
            touch "$CPU_RESULTS/watch.stop"
          fi
          if [[ -n "${PROBE_WATCH_PID:-}" ]]; then
            for _ in {1..15}; do
              kill -0 "$PROBE_WATCH_PID" 2>/dev/null || break
              sleep 1
            done
          fi
      - name: Revalidate GDN diagnostic identity, nodes, and JUnit
        if: always() && inputs.probe_suite == 'gdn'
        run: python scripts/ci/ppu_device_probe.py finish
      - name: Upload diagnostic evidence (not qualification results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-device-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.board }}
          path: /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/device-probe/${{ matrix.board }}/
          if-no-files-found: error
          retention-days: 14
