name: PPU pin unit tests

on:
  workflow_call:
    inputs:
      build_run_id:
        description: Build PPU wheels run supplying ppu-wheels-<run_id>
        required: true
        type: string
      image:
        description: SAIL runtime image, as used by the E2E smoke
        type: string
        default: reg.docker.alibaba-inc.com/ai-tmp/llm:pytorch2.13.0-ubuntu24.04-cuda13.0-vllm0.27.0-py312-ppu202609111952

permissions:
  contents: read
  actions: read

jobs:
  pin-unit-tests:
    name: vLLM pin (${{ matrix.pin-file }})
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    strategy:
      fail-fast: false
      matrix:
        pin-file:
          - vllm-release-tag.commit
          - vllm-main-verified.commit
    env:
      WHEELS_DIR: /tmp/ppu-wheels
      VLLM_USE_RUST_FRONTEND: "0"
      VLLM_USE_RUST_BENCH: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The self-hosted CPU runner image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done
          echo "=== insteadOf after (system) ==="
          git config --system --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none
          echo "=== insteadOf after (global) ==="
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: ${{ env.WHEELS_DIR }}
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify wheel manifest and pin
        id: manifest
        env:
          PIN_FILE: ${{ matrix.pin-file }}
        run: |
          python scripts/ci/ppu_wheel_manifest.py verify "${WHEELS_DIR}"
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          manifest = json.loads((Path(os.environ["WHEELS_DIR"]) / "wheel-manifest.json").read_text())
          pin = Path(".github", os.environ["PIN_FILE"]).read_text().strip()
          if re.fullmatch(r"[0-9a-f]{40}", pin):
              expected = pin
          else:
              # Release pins are tags; prefer the peeled commit for annotated tags.
              tag = f"refs/tags/{pin}"
              output = subprocess.check_output(
                  ["git", "ls-remote", "--exit-code", "https://github.com/vllm-project/vllm.git", tag, tag + "^{}"],
                  text=True,
              )
              refs = dict(line.split()[::-1] for line in output.splitlines())
              expected = refs.get(tag + "^{}", refs.get(tag))
              if not expected:
                  raise SystemExit(f"Cannot resolve release pin: {pin}")
          actual = manifest["commits"]["vllm"]
          matches = actual == expected
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matches={str(matches).lower()}\n")
          summary = f"{os.environ['PIN_FILE']}: build={actual}, pin={expected}"
          if not matches:
              summary += "; UT skipped because this build does not contain that pin"
              print(f"::notice::{summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PYTHON

      - name: Run pin UT in a fresh single-card PPU container
        if: steps.manifest.outputs.matches == 'true'
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ inputs.image }}
          nnodes: 0
          nproc_per_node: 1
          namespace: ppu-sched
          node_selector: board-type=OAM-810E
          timeout_minutes: 20
          cleanup_policy: always
          job_suffix: ${{ matrix.pin-file }}
          source_dir: /workspace/source
          artifact_paths: ${{ env.WHEELS_DIR }}
          extra_env: WHEELS_DIR=/workspace/source/ppu-wheels,UT_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-${{ matrix.pin-file }},VLLM_USE_RUST_FRONTEND=0,VLLM_USE_RUST_BENCH=0
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          command: cd /workspace/source && bash scripts/ci/ppu_pin_ut.sh

      - name: Upload pin UT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pin-${{ matrix.pin-file }}-${{ github.run_id }}
          path: |
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-${{ matrix.pin-file }}/*.log
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-${{ matrix.pin-file }}/pin-ut.xml
            ${{ env.WHEELS_DIR }}/wheel-manifest.json
          if-no-files-found: warn
          retention-days: 14
