name: PPU CI report

on:
  workflow_run:
    workflows: [PPU PR CI]
    types: [requested, in_progress, completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional executor run ID to reconcile (blank discovers unfinished reports)
        type: string
        default: ''

permissions: {}
cache-mode: none

jobs:
  identify:
    if: >-
      github.repository == 't-head/vllm-sail' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ppu-report-discovery-${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_id == '')) && 'sweep' || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      matrix: ${{ steps.identity.outputs.matrix }}
      has_targets: ${{ steps.identity.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Discover trusted requests with unfinished reports
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CURSOR_FILE: ${{ runner.temp }}/ppu-report-cursor/cursor.json
        run: python -m scripts.ci.ppu_ci_report discover
      - name: Persist the reporting-only sweep checkpoint
        if: steps.identity.outputs.cursor_written == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ppu-report-cursor-v1
          path: ${{ runner.temp }}/ppu-report-cursor/cursor.json
          if-no-files-found: error
          retention-days: 90

  report:
    needs: identify
    if: >-
      needs.identify.outputs.has_targets == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identify.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ppu-control-pr-${{ matrix.pr_number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile checks from fresh GitHub API evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ matrix.run_id }}
          REPORT_PR_NUMBER: ${{ matrix.pr_number }}
        run: python -m scripts.ci.ppu_ci_report
