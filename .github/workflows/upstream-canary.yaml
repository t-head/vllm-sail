name: Upstream patch canary

on:
  schedule:
    # Weekly, off-peak, and deliberately not on a round minute.
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  patch-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install upstream vLLM main
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install "vllm @ git+https://github.com/vllm-project/vllm.git@main"
      # This bounds an upstream bump: every changed patched body becomes an
      # explicit review item instead of failing later on customer hardware.
      - name: Check patched upstream source
        id: drift
        continue-on-error: true
        run: python tools/check_patch_drift.py 2>&1 | tee patch-drift.txt
      - name: Open or update the upstream-drift issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Upstream vLLM patch drift detected";
            const report = fs.readFileSync("patch-drift.txt", "utf8");
            const body = [
              "The weekly upstream-main canary detected patch drift.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```text",
              report.slice(0, 60000),
              "```",
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail the canary after filing the issue
        if: steps.drift.outcome == 'failure'
        run: exit 1
